# Reference reverse-proxy configuration used as the benchmark baseline for
# sluice, matched to sluice's target feature set:
# - one worker process (sluice is single-threaded)
# - longest-prefix routing (nginx prefix locations pick the longest match)
# - round-robin load balancing with passive failure detection
# - client keep-alive, but a fresh upstream connection per request (no
#   `keepalive` directive in the upstream blocks), since sluice does not
#   pool upstream connections
# - no access log, since sluice does not write one
# No TLS, no HTTP/2.
#
# The routes below are placeholders until sluice's own route config lands
# (Week 3); keep both gateways' routing tables identical when it does.

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    access_log off;

    upstream all_backends {
        server backend-a:9000 max_fails=3 fail_timeout=30s;
        server backend-b:9000 max_fails=3 fail_timeout=30s;
        server backend-c:9000 max_fails=3 fail_timeout=30s;
    }

    upstream api_backends {
        server backend-a:9000 max_fails=3 fail_timeout=30s;
        server backend-b:9000 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 8081;

        location /api/ {
            proxy_pass http://api_backends;
            proxy_http_version 1.1;
        }

        location / {
            proxy_pass http://all_backends;
            proxy_http_version 1.1;
        }
    }
}
