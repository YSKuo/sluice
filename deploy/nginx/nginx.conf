# Reference reverse-proxy configuration used as the benchmark baseline for
# sluice. Functionally equivalent to sluice's target feature set: round-robin
# load balancing across three backends, passive failure detection, and
# keep-alive connections. No TLS, no HTTP/2 - matched to sluice's scope.

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    upstream backends {
        server backend-a:9000 max_fails=3 fail_timeout=30s;
        server backend-b:9000 max_fails=3 fail_timeout=30s;
        server backend-c:9000 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 8081;

        location / {
            proxy_pass http://backends;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
