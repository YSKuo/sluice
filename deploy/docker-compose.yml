# Benchmark stack: sluice and Nginx side by side, in front of the same
# three backends. Both gateways get the same CPU and memory limits so their
# results are comparable ("matched conditions"); see bench/README.md.

x-gateway-limits: &gateway-limits
  cpus: "1"
  mem_limit: 256m

services:
  sluice:
    <<: *gateway-limits
    build:
      context: ..
      dockerfile: deploy/sluice/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - backend-a
      - backend-b
      - backend-c

  nginx:
    <<: *gateway-limits
    image: nginx:1.27
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8081:8081"
    depends_on:
      - backend-a
      - backend-b
      - backend-c

  backend-a:
    build:
      context: ./backends
    command: ["--name", "backend-a", "--port", "9000"]
    ports:
      - "9001:9000"

  backend-b:
    build:
      context: ./backends
    command: ["--name", "backend-b", "--port", "9000"]
    ports:
      - "9002:9000"

  backend-c:
    build:
      context: ./backends
    command: ["--name", "backend-c", "--port", "9000"]
    ports:
      - "9003:9000"
