name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Format, clang-tidy, build, and test (both presets)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Same Ubuntu release and LLVM 18 packages as .devcontainer/Dockerfile,
      # so clang-format and clang-tidy results match local runs.
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates clang-18 clang-format-18 clang-tidy-18 cmake \
            libclang-rt-18-dev ninja-build
      - name: Run scripts/check.sh
        run: ./scripts/check.sh

  devcontainer:
    name: Devcontainer image builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f .devcontainer/Dockerfile .
